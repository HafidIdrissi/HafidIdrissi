<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 396" width="1200" height="396" role="img" aria-labelledby="ttTitle ttDesc">
  <title id="ttTitle">Time Tracker &#8212; where your activity data goes</title>
  <desc id="ttDesc">On your machine: your activity (app, window, tab, idle) is written to timetracker.db, a local SQLite file, and rendered to report.html, which opens offline. Nothing crosses that boundary: no account, no server, no telemetry.</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6A3D"/><stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="394" rx="18" fill="#12151B" stroke="#232833" stroke-width="2"/>
  <rect x="1" y="1" width="6" height="394" fill="url(#edge)"/>

  <circle cx="48" cy="56" r="8" fill="#FF6A3D"/>
  <text x="70" y="65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="700" letter-spacing="-0.6" fill="#E9EBEF">Time Tracker</text>
  <rect x="262" y="40" width="132" height="30" rx="15" fill="none" stroke="#3DDC97" stroke-width="1.6"/>
  <text x="328" y="61" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="15" letter-spacing="1.2" fill="#3DDC97">OPEN SOURCE</text>
  <text x="1156" y="64" text-anchor="end" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="18" fill="#6A7484">Windows 10 &#183; 11</text>

  <text x="44" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#98A1B0">Where your activity data goes &#8212; the whole diagram.</text>

  <rect x="44" y="136" width="1112" height="164" rx="14" fill="none" stroke="#232833" stroke-dasharray="7 5"/>
  <text x="64" y="164" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="15" letter-spacing="2.4" fill="#6A7484">YOUR MACHINE</text>

  <rect x="76" y="176" width="300" height="92" rx="12" fill="#171B23" stroke="#232833"/>
  <text x="100" y="216" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="20" font-weight="600" fill="#E9EBEF">Your activity</text>
  <text x="100" y="245" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#6A7484">app, window, tab, idle</text>
  <rect x="450" y="176" width="300" height="92" rx="12" fill="#171B23" stroke="#232833"/>
  <text x="474" y="216" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="20" font-weight="600" fill="#E9EBEF">timetracker.db</text>
  <text x="474" y="245" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#6A7484">local SQLite file</text>
  <rect x="824" y="176" width="300" height="92" rx="12" fill="#171B23" stroke="#232833"/>
  <text x="848" y="216" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="20" font-weight="600" fill="#E9EBEF">report.html</text>
  <text x="848" y="245" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#6A7484">opens offline</text>
  <line x1="392" y1="222" x2="432" y2="222" stroke="#FF6A3D" stroke-width="2.4"/>
  <path d="M432 222 l-10 -6 v12 z" fill="#FF6A3D"/>
  <line x1="766" y1="222" x2="806" y2="222" stroke="#FF6A3D" stroke-width="2.4"/>
  <path d="M806 222 l-10 -6 v12 z" fill="#FF6A3D"/>

  <circle cx="56" cy="345" r="12" fill="none" stroke="#FF6A3D" stroke-width="2.2"/>
  <path d="M50 339 l12 12 M62 339 l-12 12" stroke="#FF6A3D" stroke-width="2.2" stroke-linecap="round"/>
  <text x="82" y="341" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#E9EBEF">Nothing crosses that boundary.</text>
  <text x="82" y="366" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#6A7484">No account, no server, no telemetry &#8212; so there is nothing to opt out of.</text>
</svg>
