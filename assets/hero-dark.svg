<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Hafid Idrissi &#8212; software engineer</title>
  <desc id="heroDesc">I build software that doesn&#8217;t phone home. Local-first tools people can audit, and the cloud and embedded work behind them. Azure, Kubernetes, Python, TypeScript, ROS, PyMC.</desc>
  <defs>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6A3D"/><stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <radialGradient id="gA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FF6A3D" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FF6A3D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="#0A0B0D"/>
    <ellipse cx="1055" cy="34" rx="330" ry="215" fill="url(#gA)"/>
    <ellipse cx="1200" cy="285" rx="285" ry="185" fill="url(#gB)"/>
    <rect width="1200" height="300" fill="none" stroke="#232833" stroke-width="2" rx="18"/>
  </g>

  <text x="72" y="70" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="17" letter-spacing="3.4" fill="#6A7484">HAFID IDRISSI &#183; SOFTWARE ENGINEER</text>
  <text x="72" y="142" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="46" font-weight="700" letter-spacing="-1.4" fill="#E9EBEF">I build software that doesn&#8217;t phone home.</text>
  <rect x="73" y="166" width="70" height="4" rx="2" fill="url(#rule)"/>
  <text x="72" y="212" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#98A1B0">Local-first tools people can actually audit &#8212; and the cloud and</text>
  <text x="72" y="242" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#98A1B0">embedded work behind them.</text>
  <text x="72" y="276" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="18" fill="#6A7484">Azure &#183; Kubernetes &#183; Python &#183; TypeScript &#183; ROS &#183; PyMC</text>
</svg>
